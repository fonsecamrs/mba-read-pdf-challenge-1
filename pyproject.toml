# Tool configuration only. Dependencies are declared in requirements*.txt.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Raised inside google-genai on Python 3.14; not actionable in this project
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]
