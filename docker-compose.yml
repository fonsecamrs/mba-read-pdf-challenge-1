services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      # Published only on localhost: not reachable from other machines (SEC-003)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images expect the volume at /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
      # Bootstrap scripts, executed only when the volume is empty
      - ./docs/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: only succeeds after the bootstrap scripts have finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
